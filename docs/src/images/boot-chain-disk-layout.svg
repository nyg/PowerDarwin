<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" width="760" height="405" font-family="Helvetica, Arial, sans-serif">
<title>Layout of the test image: block 0, the partition map, and the Darwin9 HFS+ volume with its blessed folder, BootX, mach_kernel and the driver cache</title>
<g fill="#8a8a8a">
<text x="380" y="24" text-anchor="middle" font-size="15">The test image: one disk with an Apple Partition Map</text>
<rect x="20" y="42" width="170" height="50" rx="4" fill="none" fill-opacity="0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="105.0" y="63.0" text-anchor="middle" font-size="12.5">Block 0</text>
<text x="105.0" y="80.0" text-anchor="middle" font-size="11">driver descriptor map</text>
<rect x="195" y="42" width="210" height="50" rx="4" fill="none" fill-opacity="0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="300.0" y="63.0" text-anchor="middle" font-size="12.5">Partition 1</text>
<text x="300.0" y="80.0" text-anchor="middle" font-size="11">Apple_partition_map</text>
<rect x="410" y="42" width="330" height="50" rx="4" fill="none" fill-opacity="0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="575.0" y="63.0" text-anchor="middle" font-size="12.5">Partition 2: Darwin9</text>
<text x="575.0" y="80.0" text-anchor="middle" font-size="11">Apple_HFS</text>
<line x1="575" y1="92" x2="575" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="20" y="120" width="720" height="270" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="30" y="137" font-size="12">The Darwin9 volume, HFS+</text>
<rect x="35" y="150" width="250" height="50" rx="4" fill="none" fill-opacity="0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="160.0" y="171.0" text-anchor="middle" font-size="12.5">Volume header</text>
<text x="160.0" y="188.0" text-anchor="middle" font-size="11">Finder info word 0: blessed folder</text>
<text x="315" y="160" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">/</text>
<text x="315" y="182" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">├─ mach_kernel</text>
<text x="725" y="182" font-size="12" text-anchor="end">the kernel</text>
<text x="315" y="204" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">├─ System/Library/</text>
<text x="315" y="226" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">│  ├─ CoreServices/</text>
<text x="725" y="226" font-size="12" text-anchor="end">the blessed folder</text>
<text x="315" y="248" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">│  │  ├─ BootX</text>
<text x="725" y="248" font-size="12" text-anchor="end">type tbxi, creator chrp</text>
<text x="315" y="270" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">│  │  └─ SystemVersion.plist</text>
<text x="315" y="292" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">│  ├─ Extensions/</text>
<text x="725" y="292" font-size="12" text-anchor="end">the kexts</text>
<text x="315" y="314" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">│  └─ Extensions.mkext</text>
<text x="725" y="314" font-size="12" text-anchor="end">the driver cache</text>
<text x="315" y="336" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">└─ Library/Preferences/SystemConfiguration/</text>
<text x="315" y="358" font-size="12.5" font-family="Menlo, Consolas, monospace" xml:space="preserve">   └─ com.apple.Boot.plist</text>
<text x="725" y="358" font-size="12" text-anchor="end">kernel name and flags</text>
<line x1="285" y1="175" x2="310" y2="222" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
</g>
</svg>
